const sections = [];
(function parse() {
  let sec = null, unit = null;
  for (const raw of document.getElementById('data').textContent.split('\n')) {
    const line = raw.trim();
    if (!line) continue;
    if (line.startsWith('@')) {
      const [title, pages] = line.slice(1).split('|').map(s => s.trim());
      sec = { title, pages, items: [], vocab: [] };
      sections.push(sec);
    } else if (line.startsWith('V ')) {
      sec.vocab = line.slice(2).split(' / ').map(s => {
        const k = s.indexOf('=');
        return [s.slice(0, k).trim(), s.slice(k + 1).trim()];
      });
    } else if (line === '!') {
      unit = { type: 'h', tokens: [] };
      sec.items.push(unit);
    } else if (line.startsWith('# ')) {
      unit = { type: 's', n: line.slice(2).trim(), tokens: [] };
      sec.items.push(unit);
    } else {
      let s = line, key = false, mean = '', note = '';
      if (s.startsWith('*')) { key = true; s = s.slice(1); }
      const eq = s.indexOf(' = ');
      let word = s;
      if (eq >= 0) {
        word = s.slice(0, eq);
        let rest = s.slice(eq + 3);
        const sc = rest.indexOf(' ; ');
        if (sc >= 0) { note = rest.slice(sc + 3); rest = rest.slice(0, sc); }
        mean = rest;
      }
      const m = word.trim().match(/^([("“]*)(.*?)([.,;:!?)"”]*)$/);
      const core = m[2];
      if (!mean) mean = DEFAULTS[core.toLowerCase()] || '';
      unit.tokens.push({ lead: m[1], core, trail: m[3], mean, note, key });
    }
  }
})();

const main = document.getElementById('main');
const nav = document.getElementById('nav');

function esc(s) {
  return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}
function wordsHTML(tokens) {
  return tokens.map(t => {
    const i = ALL.push(t) - 1;
    return esc(t.lead) +
      `<span class="w${t.key ? ' key' : ''}" data-i="${i}" tabindex="0" role="button">${esc(t.core)}</span>` +
      esc(t.trail);
  }).join(' ');
}

sections.forEach((sec, si) => {
  const nums = sec.items.filter(it => it.type === 's').map(it => it.n);
  const id = 'r' + (si + 1);
  nav.insertAdjacentHTML('beforeend',
    `<a href="#${id}">${esc(sec.title.replace("LET'S READ ", ''))}<small>${nums[0]}–${nums[nums.length - 1]}</small></a>`);
  let html = `<section id="${id}"><div class="read-head"><span class="badge">${esc(sec.title)}</span><span class="pages">${esc(sec.pages)}</span></div>`;
  for (const it of sec.items) {
    html += it.type === 'h'
      ? `<h2>${wordsHTML(it.tokens)}</h2>`
      : `<p class="sent"><span class="num">${esc(it.n)}</span><span class="txt">${wordsHTML(it.tokens)}</span></p>`;
  }
  if (sec.vocab.length) {
    html += `<div class="vocab"><div class="label">이 부분의 핵심 어휘</div><ul>` +
      sec.vocab.map(([w, m]) => `<li><b>${esc(w)}</b>${esc(m)}</li>`).join('') + `</ul></div>`;
  }
  main.insertAdjacentHTML('beforeend', html + '</section>');
});

// 뜻 카드
const page = document.getElementById('page');
const pop = document.getElementById('pop');
const pw = pop.querySelector('.pw'), pm = pop.querySelector('.pm'), pn = pop.querySelector('.pn');
let current = null;

function openWord(el) {
  if (current) current.classList.remove('on');
  current = el;
  el.classList.add('on');
  const t = ALL[+el.dataset.i];
  pw.innerHTML = esc(t.core) + (t.key ? '<span class="tag">핵심 어휘</span>' : '');
  pm.textContent = t.mean;
  pn.textContent = t.note;
  pop.classList.add('show');
  place(el);
}
function place(el) {
  // 단어 바로 아래(공간이 없으면 위)에 카드를 띄우고, 화면 밖으로 나가지 않게 맞춤
  const rects = el.getClientRects();
  const r = rects[rects.length - 1] || el.getBoundingClientRect();
  const pr = page.getBoundingClientRect();
  const pwid = pop.offsetWidth, phei = pop.offsetHeight;
  const gap = 8, side = 12;
  let left = r.left - pr.left;
  left = Math.max(side - pr.left, Math.min(left, document.documentElement.clientWidth - pr.left - pwid - side));
  let top = r.bottom - pr.top + gap;
  if (r.bottom + gap + phei > window.innerHeight - side && r.top - gap - phei > 60) {
    top = r.top - pr.top - gap - phei;
  }
  pop.style.left = left + 'px';
  pop.style.top = top + 'px';
}
function closePop() {
  pop.classList.remove('show');
  if (current) current.classList.remove('on');
  current = null;
}

main.addEventListener('click', e => {
  const el = e.target.closest('.w');
  if (!el) return;
  e.stopPropagation();
  if (el === current) closePop(); else openWord(el);
});
main.addEventListener('keydown', e => {
  const el = e.target.closest('.w');
  if (el && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openWord(el); }
});
pop.querySelector('button').addEventListener('click', closePop);
pop.addEventListener('click', e => e.stopPropagation());
document.addEventListener('click', closePop);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePop(); });
window.addEventListener('resize', () => { if (current) place(current); });
</script>
</body>
</html>
